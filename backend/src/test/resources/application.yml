# Test profile: runs entirely on in-memory H2 so JUnit needs no Supabase credentials.
spring:
  datasource:
    url: jdbc:h2:mem:cimbtest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  encryption:
    key: DA3fCK0JE1V0OTVFWaknpKm3N3zM8nlkWQ5wc8w5y7o=
  payment:
    signing-key: test-payment-signing-secret
  backup:
    dir: ./target/test-backups

logging:
  level:
    com.cimb.demo: WARN
